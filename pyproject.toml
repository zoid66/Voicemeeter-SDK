[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemeeter-sdk-python"
version = "0.1.0"
description = "Python bindings and demo scripts for the Voicemeeter SDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Copilot" }]

[tool.setuptools]
py-modules = ["voicemeeter_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
